[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pointclicker"
version = "0.1.0"
requires-python = ">=3.11"
description = "Cross-platform auto-clicker for scheduled on-screen clicks"
dependencies = [
    "platformdirs>=4.0.0",
    "pynput>=1.7.0",
    "PySide6>=6.5.0",
    "pywin32>=306; sys_platform == 'win32'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "evdev>=1.6.0; sys_platform == 'linux'",
    "jeepney>=0.8 ; sys_platform == 'linux'",
    "pyside6-fluent-widgets>=1.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
pointclicker = "pointclicker.ui:main"

[tool.setuptools.package-data]
pointclicker = ["*.ico", "ui/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
